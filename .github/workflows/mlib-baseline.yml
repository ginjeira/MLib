name: MLib baseline validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlib-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android debug build (both ABIs)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2'
      SPOTYGRAM_STATE: ${{ github.workspace }}/../mlib-android-state
      ANDROID_SDK_ROOT: ${{ github.workspace }}/../mlib-android-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || { status=$?; [ "$status" -eq 141 ]; }
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" "platform-tools"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build gperf perl git python3
      - uses: gradle/actions/setup-gradle@v6
      - name: Build TDLib, OpenSSL and Android debug APKs
        env:
          TELEGRAM_API_ID: '0'
          TELEGRAM_API_HASH: ''
          SPOTYGRAM_JOBS: '2'
        run: bash tools/build.sh debug
      - name: Verify both ABI APK outputs
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$SPOTYGRAM_STATE/build/app/outputs/apk/debug"
          test -s "$APK_DIR/app-arm64-v8a-debug.apk"
          test -s "$APK_DIR/app-x86_64-debug.apk"
          ls -lh "$APK_DIR"/*.apk

  desktop-linux-image:
    name: Desktop Linux application image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2'
      SPOTYGRAM_STATE: ${{ github.workspace }}/../mlib-desktop-state
      TELEGRAM_API_ID: '0'
      TELEGRAM_API_HASH: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Linux packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils fakeroot
      - name: Build desktop application image (without signing or publishing)
        run: python3 tools/build-desktop.py --image-only
      - name: Verify desktop launcher and runtime image
        run: |
          test -x "$SPOTYGRAM_STATE/build/desktop/distributions/main/app/Spotygram/bin/Spotygram"
          test -s "$SPOTYGRAM_STATE/build/desktop/distributions/main/app/Spotygram/lib/app/Spotygram.cfg"
          find "$SPOTYGRAM_STATE/build/desktop/distributions/main/app/Spotygram" -maxdepth 2 -type f | head -40
