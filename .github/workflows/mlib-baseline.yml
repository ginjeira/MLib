name: MLib baseline validation

on:
  push:
    branches:
      - feat/mlib-independent-identity
    paths:
      - 'app/**'
      - 'desktop/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'tools/build*.sh'
      - 'tools/build-desktop.py'
      - 'tools/desktop-dependencies.py'
      - '.github/workflows/mlib-baseline.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'desktop/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'tools/build*.sh'
      - 'tools/build-desktop.py'
      - 'tools/desktop-dependencies.py'
      - '.github/workflows/mlib-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlib-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android debug build (both ABIs)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2'
      MLIB_STATE: ${{ github.workspace }}/../mlib-android-state
      ANDROID_SDK_ROOT: ${{ github.workspace }}/../mlib-android-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" "platform-tools"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build gperf perl git python3
      - uses: gradle/actions/setup-gradle@v6
      - name: Build TDLib, OpenSSL and Android debug APKs
        env:
          TELEGRAM_API_ID: '0'
          TELEGRAM_API_HASH: ''
          MLIB_JOBS: '2'
        run: bash tools/build.sh debug
      - name: Verify both ABI APK outputs
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$MLIB_STATE/build/app/outputs/apk/debug"
          APKS=("$APK_DIR"/*.apk)
          test "${#APKS[@]}" -eq 2
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          VERSION=$(sed -nE 's/^version = "([0-9]+\\.[0-9]+\\.[0-9]+)"$/\\1/p' build.gradle.kts)
          for APK in "${APKS[@]}"; do
            test -s "$APK"
            BADGING=$("$AAPT" dump badging "$APK")
            grep -F "package: name='pt.ginjeira.mlib.dev'" <<< "$BADGING"
            grep -F "versionName='$VERSION'" <<< "$BADGING"
            if grep -q "native-code:.*arm64-v8a" <<< "$BADGING"; then
              test -z "${ARM64_APK:-}"
              ARM64_APK="$APK"
            elif grep -q "native-code:.*x86_64" <<< "$BADGING"; then
              test -z "${X86_64_APK:-}"
              X86_64_APK="$APK"
            else
              echo "Unexpected or missing ABI in $APK" >&2
              exit 1
            fi
          done
          test -s "$ARM64_APK"
          test -s "$X86_64_APK"
          ls -lh "${APKS[@]}"

  desktop-linux-image:
    name: Desktop Linux application image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2'
      MLIB_STATE: ${{ github.workspace }}/../mlib-desktop-state
      TELEGRAM_API_ID: '0'
      TELEGRAM_API_HASH: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Linux packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils fakeroot
      - name: Build desktop application image (without signing or publishing)
        run: python3 tools/build-desktop.py --image-only
      - name: Verify desktop launcher and runtime image
        run: |
          test -x "$MLIB_STATE/build/desktop/distributions/main/app/MLib/bin/MLib"
          test -s "$MLIB_STATE/build/desktop/distributions/main/app/MLib/lib/app/MLib.cfg"
          find "$MLIB_STATE/build/desktop/distributions/main/app/MLib" -maxdepth 2 -type f | head -40
