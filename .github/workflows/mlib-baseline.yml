name: MLib baseline validation

on:
  push:
    branches:
      - feat/mlib-independent-identity
    paths:
      - 'app/**'
      - 'desktop/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'tools/build*.sh'
      - 'tools/build-desktop.py'
      - 'tools/desktop-dependencies.py'
      - '.github/workflows/mlib-baseline.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'desktop/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'tools/build*.sh'
      - 'tools/build-desktop.py'
      - 'tools/desktop-dependencies.py'
      - '.github/workflows/mlib-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlib-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android debug build (both ABIs)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2'
      MLIB_STATE: ${{ github.workspace }}/../mlib-android-state
      ANDROID_SDK_ROOT: ${{ github.workspace }}/../mlib-android-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" "platform-tools"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build gperf perl git python3
      - name: Configure stable MLib debug signing when available
        env:
          MLIB_ANDROID_KEYSTORE_BASE64: ${{ secrets.MLIB_ANDROID_KEYSTORE_BASE64 }}
          MLIB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MLIB_ANDROID_KEYSTORE_PASSWORD }}
          MLIB_ANDROID_KEY_ALIAS: ${{ secrets.MLIB_ANDROID_KEY_ALIAS }}
          MLIB_ANDROID_KEY_PASSWORD: ${{ secrets.MLIB_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MLIB_ANDROID_KEYSTORE_BASE64:-}" &&
                -z "${MLIB_ANDROID_KEYSTORE_PASSWORD:-}" &&
                -z "${MLIB_ANDROID_KEY_ALIAS:-}" &&
                -z "${MLIB_ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "MLIB_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning::No MLib signing key configured. Build validation will run, but no installable APK artifact will be uploaded because the default CI debug key changes between runners."
            exit 0
          fi
          test -n "${MLIB_ANDROID_KEYSTORE_BASE64:-}"
          test -n "${MLIB_ANDROID_KEYSTORE_PASSWORD:-}"
          test -n "${MLIB_ANDROID_KEY_ALIAS:-}"
          test -n "${MLIB_ANDROID_KEY_PASSWORD:-}"
          mkdir -p "$MLIB_STATE"
          printf '%s' "$MLIB_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$MLIB_STATE/mlib-release.jks"
          chmod 600 "$MLIB_STATE/mlib-release.jks"
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$MLIB_ANDROID_KEYSTORE_PASSWORD" "$MLIB_ANDROID_KEY_ALIAS" "$MLIB_ANDROID_KEY_PASSWORD" \
            > "$MLIB_STATE/signing.properties"
          chmod 600 "$MLIB_STATE/signing.properties"
          keytool -list -keystore "$MLIB_STATE/mlib-release.jks" \
            -storepass "$MLIB_ANDROID_KEYSTORE_PASSWORD" -alias "$MLIB_ANDROID_KEY_ALIAS" >/dev/null
          echo "MLIB_SIGNING_READY=true" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate Telegram API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${TELEGRAM_API_ID:-}" =~ ^[0-9]+$ ]] || [[ "${TELEGRAM_API_ID}" == "0" ]]; then
            echo "::error::TELEGRAM_API_ID is missing or invalid. Configure the repository Actions secret."
            exit 1
          fi
          if [[ -z "${TELEGRAM_API_HASH:-}" ]]; then
            echo "::error::TELEGRAM_API_HASH is missing. Configure the repository Actions secret."
            exit 1
          fi
      - name: Build TDLib, OpenSSL and Android debug APKs
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          MLIB_JOBS: '2'
        run: bash tools/build.sh debug
      - name: Verify both ABI APK outputs
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$MLIB_STATE/build/app/outputs/apk/debug"
          APKS=("$APK_DIR"/*.apk)
          test "${#APKS[@]}" -eq 2
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          VERSION=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' build.gradle.kts)
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for APK in "${APKS[@]}"; do
            test -s "$APK"
            if [[ "${MLIB_SIGNING_READY:-false}" == "true" ]]; then
              "$APKSIGNER" verify --verbose --print-certs "$APK"
            fi
            BADGING=$("$AAPT" dump badging "$APK")
            grep -F "package: name='pt.ginjeira.mlib.dev'" <<< "$BADGING"
            grep -F "versionName='$VERSION'" <<< "$BADGING"
            if grep -q "native-code:.*arm64-v8a" <<< "$BADGING"; then
              test -z "${ARM64_APK:-}"
              ARM64_APK="$APK"
            elif grep -q "native-code:.*x86_64" <<< "$BADGING"; then
              test -z "${X86_64_APK:-}"
              X86_64_APK="$APK"
            else
              echo "Unexpected or missing ABI in $APK" >&2
              exit 1
            fi
          done
          test -s "$ARM64_APK"
          test -s "$X86_64_APK"
          ls -lh "${APKS[@]}"

          mkdir -p "$RUNNER_TEMP/mlib-apks"
          cp "$ARM64_APK" "$RUNNER_TEMP/mlib-apks/MLib-debug-arm64.apk"
          cp "$X86_64_APK" "$RUNNER_TEMP/mlib-apks/MLib-debug-x86_64.apk"

      - name: Upload Android debug APK artifacts
        if: env.MLIB_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MLib-Android-debug
          path: ${{ runner.temp }}/mlib-apks/*.apk
          if-no-files-found: error
          retention-days: 30

  desktop-linux-image:
    name: Desktop Linux application image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2'
      MLIB_STATE: ${{ github.workspace }}/../mlib-desktop-state
      TELEGRAM_API_ID: '0'
      TELEGRAM_API_HASH: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run shared sync protocol unit tests
        run: ./gradlew :desktop:test --no-daemon --console=plain
      - name: Install Linux packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils fakeroot
      - name: Build desktop application image (without signing or publishing)
        run: python3 tools/build-desktop.py --image-only
      - name: Verify desktop launcher and runtime image
        run: |
          test -x "$MLIB_STATE/build/desktop/distributions/main/app/MLib/bin/MLib"
          test -s "$MLIB_STATE/build/desktop/distributions/main/app/MLib/lib/app/MLib.cfg"
          find "$MLIB_STATE/build/desktop/distributions/main/app/MLib" -maxdepth 2 -type f | head -40
