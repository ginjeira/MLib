name: MLib baseline validation
# Keep the baseline workflow path-filtered but self-triggering when validation logic changes.
# Telegram acquisition polling and active-job UI are covered by the current branch head.

on:
  push:
    branches:
      - main
      - feat/mlib-independent-identity
    paths:
      - 'app/**'
      - 'desktop/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'tools/build*.sh'
      - 'tools/build-desktop.py'
      - 'tools/desktop-dependencies.py'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'desktop/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'tools/build*.sh'
      - 'tools/build-desktop.py'
      - 'tools/desktop-dependencies.py'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlib-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
# Full APK packaging stays in the release workflow because it needs the native TDLib build.
# A debug Kotlin/Compose compile still runs here so Android-only source errors fail before merge.

  android-compile:
    name: Android debug compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MLIB_STATE: ${{ github.workspace }}/../mlib-android-state
      TELEGRAM_API_ID: '0'
      TELEGRAM_API_HASH: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK components
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Compile Android debug sources
        run: ./gradlew :app:compileDebugKotlin --no-daemon --console=plain

  desktop-linux-image:
    name: Desktop Linux application image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2'
      MLIB_STATE: ${{ github.workspace }}/../mlib-desktop-state
      TELEGRAM_API_ID: '0'
      TELEGRAM_API_HASH: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Run shared sync protocol unit tests
        run: ./gradlew :desktop:test --no-daemon --console=plain
      - name: Install Linux packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils fakeroot
      - name: Build desktop application image (without signing or publishing)
        run: python3 tools/build-desktop.py --image-only
      - name: Verify desktop launcher and runtime image
        run: |
          APP_DIR="$MLIB_STATE/build/desktop/distributions/main/app"
          echo "Inspecting desktop distribution: $APP_DIR"
          test -d "$APP_DIR"
          find "$APP_DIR" -maxdepth 3 -type f -printf '%M %p\n' | head -80
          IMAGE="$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$IMAGE"
          LAUNCHER="$(find "$IMAGE/bin" -maxdepth 1 -type f -executable -print -quit)"
          CONFIG="$(find "$IMAGE/lib/app" -maxdepth 1 -type f -name '*.cfg' -print -quit)"
          test -n "$LAUNCHER" && test -x "$LAUNCHER"
          test -n "$CONFIG" && test -s "$CONFIG"
          echo "Desktop image: $IMAGE"
          echo "Desktop launcher: $LAUNCHER"
          echo "Desktop config: $CONFIG"
