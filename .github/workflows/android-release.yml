name: MLib Android release candidate

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing MLib tag to build (must match build.gradle.kts version)
        required: true
        type: string
      publish_release:
        description: Publish a public GitHub release after signing and verifying both APKs
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mlib-android-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Build and verify signed MLib APKs
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      MLIB_JOBS: '2'
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      MLIB_ANDROID_KEYSTORE_BASE64: ${{ secrets.MLIB_ANDROID_KEYSTORE_BASE64 }}
      MLIB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MLIB_ANDROID_KEYSTORE_PASSWORD }}
      MLIB_ANDROID_KEY_ALIAS: ${{ secrets.MLIB_ANDROID_KEY_ALIAS }}
      MLIB_ANDROID_KEY_PASSWORD: ${{ secrets.MLIB_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" "platform-tools"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build gperf perl git
      - name: Validate tag, Telegram app credentials and MLib signing secrets
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' build.gradle.kts)
          test -n "$VERSION"
          test "$RELEASE_TAG" = "v$VERSION"
          test -n "$TELEGRAM_API_ID"
          test -n "$TELEGRAM_API_HASH"
          test -n "$MLIB_ANDROID_KEYSTORE_BASE64"
          test -n "$MLIB_ANDROID_KEYSTORE_PASSWORD"
          test -n "$MLIB_ANDROID_KEY_ALIAS"
          test -n "$MLIB_ANDROID_KEY_PASSWORD"
          MLIB_STATE="$RUNNER_TEMP/mlib-release-state"
          echo "MLIB_STATE=$MLIB_STATE" >> "$GITHUB_ENV"
          mkdir -p "$MLIB_STATE"
          printf '%s' "$MLIB_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$MLIB_STATE/mlib-release.jks"
          chmod 600 "$MLIB_STATE/mlib-release.jks"
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$MLIB_ANDROID_KEYSTORE_PASSWORD" "$MLIB_ANDROID_KEY_ALIAS" "$MLIB_ANDROID_KEY_PASSWORD" \
            > "$MLIB_STATE/signing.properties"
          chmod 600 "$MLIB_STATE/signing.properties"
          keytool -list -keystore "$MLIB_STATE/mlib-release.jks" \
            -storepass "$MLIB_ANDROID_KEYSTORE_PASSWORD" -alias "$MLIB_ANDROID_KEY_ALIAS" >/dev/null
          echo "MLIB_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Build signed Android release APKs
        run: bash tools/build.sh release
      - name: Verify package, version, ABI and signing
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$MLIB_STATE/build/app/outputs/apk/release"
          OUTPUT="$MLIB_STATE/releases/$MLIB_VERSION"
          mkdir -p "$OUTPUT"
          shopt -s nullglob
          APKS=("$APK_DIR"/*.apk)
          test "${#APKS[@]}" -eq 2
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          # Continuity of the MLib release identity. Changing this value requires a key
          # rotation plan because installed clients reject APKs signed by another key.
          EXPECTED_SIGNER_SHA256="6e8fc1d09b55e70c6183b8cbbebad96d935f01a24558af356b697a942541e200"
          for APK in "${APKS[@]}"; do
            BADGING=$("$AAPT" dump badging "$APK")
            grep -F "package: name='pt.ginjeira.mlib'" <<< "$BADGING"
            grep -F "versionName='$MLIB_VERSION'" <<< "$BADGING"
            SIGNER=$("$APKSIGNER" verify --verbose --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]')
            test "$SIGNER" = "$EXPECTED_SIGNER_SHA256"
            "$APKSIGNER" verify --verbose "$APK"
            if grep -q "native-code:.*arm64-v8a" <<< "$BADGING"; then
              cp "$APK" "$OUTPUT/mlib-$MLIB_VERSION-arm64.apk"
            elif grep -q "native-code:.*x86_64" <<< "$BADGING"; then
              cp "$APK" "$OUTPUT/mlib-$MLIB_VERSION-x86_64.apk"
            else
              echo "Unexpected or missing ABI in $APK" >&2
              exit 1
            fi
          done
          test -s "$OUTPUT/mlib-$MLIB_VERSION-arm64.apk"
          test -s "$OUTPUT/mlib-$MLIB_VERSION-x86_64.apk"
          (cd "$OUTPUT" && sha256sum *.apk > SHA256SUMS.txt)
          cat "$OUTPUT/SHA256SUMS.txt"
      - name: Stage release assets for artifact upload
        run: |
          mkdir -p ".mlib-release-artifacts/$MLIB_VERSION"
          cp "$MLIB_STATE/releases/$MLIB_VERSION/"* ".mlib-release-artifacts/$MLIB_VERSION/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mlib-android-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          path: .mlib-release-artifacts/${{ env.MLIB_VERSION }}/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$MLIB_STATE/releases/$MLIB_VERSION/mlib-$MLIB_VERSION-arm64.apk" \
              "$MLIB_STATE/releases/$MLIB_VERSION/mlib-$MLIB_VERSION-x86_64.apk" \
              "$MLIB_STATE/releases/$MLIB_VERSION/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$MLIB_STATE/releases/$MLIB_VERSION/mlib-$MLIB_VERSION-arm64.apk" \
              "$MLIB_STATE/releases/$MLIB_VERSION/mlib-$MLIB_VERSION-x86_64.apk" \
              "$MLIB_STATE/releases/$MLIB_VERSION/SHA256SUMS.txt" \
              --title "MLib $MLIB_VERSION" \
              --notes "MLib Android release candidate. Both APKs were checked for package identity, version, ABI, APK signature and SHA-256. Desktop release is not included."
          fi
